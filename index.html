<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock,Paper and Scissors</title>
    <link rel= "stylesheet" href ="style.css">
</head>
<body>
  <main>
    <h1>Stone Paper Scissors</h1>
    <div class="choices">
        <div class="choice" id="stone">
            <img src ="D:\game\SPS\stone.png" alt="Stone" >
        </div>
        <div class="choice" id="paper">
            <img src ="D:\game\SPS\paper.png" alt ="Paper" >
        </div>
        <div class="choice" id="scissors">
            <img src ="D:\game\SPS\scissors.png" alt="Scissors" >
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Comp</p>
        </div>
    </div>
    <div class="msg-container">
        <p id="msg">
            Play Your Move
        </p>
    </div>
  </main>  
   <script src="sps.js"></script>
</body>
</html>
